name: Housewife Build

# Builds the Housewife Terminal (glibc-android-15) debug APKs for the main
# branch. This is the fork's build; the legacy Termux `Build` workflow only
# targets master + apt variants.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package_variant:
        description: 'Package variant'
        required: false
        default: 'glibc-android-15'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TERMUX_PACKAGE_VARIANT: ${{ inputs.package_variant || 'glibc-android-15' }}
      # Minimal Bionic host prefix (bash/patchelf/grun carriers) embedded via
      # .incbin at native build time. Full termux-packages bootstrap; the
      # glibc userland ships separately in app/src/main/assets/.
      BIONIC_BOOTSTRAP_VERSION: '2026.02.12-r1%2Bapt.android-7'
      BIONIC_BOOTSTRAP_AARCH64_SHA256: 'ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3'
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          NDK_VERSION="$(grep -m1 '^ndkVersion=' gradle.properties | cut -d= -f2)"
          echo "Installing NDK $NDK_VERSION"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"

      - name: Fetch glibc bootstrap tarball (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          RUN_ID="$(gh run list --workflow glibc-bootstrap.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n glibc-bootstrap-arm64 -D app/src/main/assets/
            ls -lh app/src/main/assets/
          else
            echo "No successful glibc bootstrap run yet; APK builds without bundled userland (Bionic fallback)."
          fi

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Validate APKs
        run: |
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          ls -la "$APK_DIR_PATH"
          for abi in arm64-v8a; do
            if ! ls "$APK_DIR_PATH"/termux-app_*_"$abi".apk >/dev/null 2>&1; then
              echo "Missing $abi APK in $APK_DIR_PATH"
              exit 1
            fi
          done
          (cd "$APK_DIR_PATH" && sha256sum termux-app_*.apk > sha256sums.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: housewife-apks-${{ env.TERMUX_PACKAGE_VARIANT }}
          path: |
            ./app/build/outputs/apk/debug/*.apk
            ./app/build/outputs/apk/debug/sha256sums.txt
