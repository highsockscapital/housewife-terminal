name: glibc Bootstrap

# Builds the real glibc-bootstrap-<arch>.tar.xz userland payload with the
# Stock Debian userland + generated configs (no source builds) + Phase 4.1/5.2
# generated configs). The tarball is published as a workflow artifact;
# `housewife-build.yml` pulls the latest successful one into
# app/src/main/assets/ before assembling the APK. Tarballs never enter git.
#
# Heavy job (glibc from source); default timeout applies.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target arch (arm64 only for releases)'
        required: false
        default: 'arm64'
      suite:
        description: 'Debian suite'
        required: false
        default: 'bookworm'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
      SUITE: ${{ inputs.suite || 'bookworm' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install pack tools
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Cross-compile grun host runner
        run: |
          NDK_VERSION="$(grep -m1 '^ndkVersion=' gradle.properties | cut -d= -f2)"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cross-compile grun host runner
        run: |
          mkdir -p build/grun-arm64
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" \
            -std=c11 -Wall -Wextra -Werror -O3 -flto -fomit-frame-pointer -funroll-loops \
            -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 -Wl,-O1 -Wl,--gc-sections \
            app/src/main/cpp/grun.c -o build/grun-arm64/grun
          ls -l build/grun-arm64/grun

      - name: Run bootstrap pipeline
        run: sh toolchain/build-bootstrap.sh --arch "$ARCH" --suite "$SUITE"

      - name: Stage tarball
        run: |
          mkdir -p dist
          mv "app/src/main/assets/glibc-bootstrap-$ARCH.tar.xz" dist/
          ls -lh dist/
          test -s "dist/glibc-bootstrap-$ARCH.tar.xz"

      - name: Upload bootstrap tarball
        uses: actions/upload-artifact@v6
        with:
          name: glibc-bootstrap-${{ env.ARCH }}
          path: dist/glibc-bootstrap-${{ env.ARCH }}.tar.xz
          retention-days: 90
